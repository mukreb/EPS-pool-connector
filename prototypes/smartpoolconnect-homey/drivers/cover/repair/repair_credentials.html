<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reconnect SmartPoolConnect</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font-family: monospace; }
    .hint { color: #666; font-size: 0.85em; margin-top: 4px; }
    .error { color: #c00; margin-top: 12px; min-height: 1.2em; }
    button { margin-top: 20px; padding: 10px 20px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .field { display: none; }
    .field.active { display: block; }
  </style>
</head>
<body>
  <p>
    This device's credential was rejected (expired or revoked). Paste a new
    API key or access token below. An API key does not expire for about a
    year; an access token from a browser session can expire at any time
    without warning, which is exactly why this screen exists.
  </p>

  <label for="credentialType">Credential type</label>
  <select id="credentialType">
    <option value="key">API key (recommended)</option>
    <option value="token">Access token (temporary)</option>
  </select>

  <div id="fieldKey" class="field active">
    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" autocomplete="off" placeholder="spc_..." />
  </div>

  <div id="fieldToken" class="field">
    <label for="accessToken">Access token</label>
    <input id="accessToken" type="password" autocomplete="off" placeholder="eyJ..." />
  </div>

  <div id="error" class="error"></div>
  <button id="next" type="button">Save</button>

  <script>
    const typeSelect = document.getElementById('credentialType');
    const fieldKey = document.getElementById('fieldKey');
    const fieldToken = document.getElementById('fieldToken');
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('next');

    typeSelect.addEventListener('change', () => {
      const isToken = typeSelect.value === 'token';
      fieldKey.classList.toggle('active', !isToken);
      fieldToken.classList.toggle('active', isToken);
    });

    btn.addEventListener('click', async () => {
      errorEl.textContent = '';
      btn.disabled = true;
      try {
        const type = typeSelect.value;
        const value = type === 'token'
          ? document.getElementById('accessToken').value.trim()
          : document.getElementById('apiKey').value.trim();
        if (!value) {
          throw new Error(type === 'token' ? 'Access token is required' : 'API key is required');
        }
        await Homey.emit('repair_credentials', { credential: { type, value } });
        Homey.done();
      } catch (err) {
        errorEl.textContent = err && err.message ? err.message : String(err);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
