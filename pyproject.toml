[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eps-pool-connector"
version = "0.1.0"
description = "Command-line connector for EPS NEXUS based pools (Europe Pool Supply) via the PoolBuilder / SmartPoolControl Public API"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
eps = "eps_pool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
