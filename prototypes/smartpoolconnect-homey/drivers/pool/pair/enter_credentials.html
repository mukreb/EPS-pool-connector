<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title data-i18n="pair.credentials.title">Enter your SmartPoolConnect API key</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font-family: monospace; }
    .hint { color: #666; font-size: 0.85em; margin-top: 4px; }
    .error { color: #c00; margin-top: 12px; min-height: 1.2em; }
    button { margin-top: 20px; padding: 10px 20px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <p>
    Paste your SmartPoolConnect API key below. Keys start with
    <code>spc_</code> and are issued by your pool installer or by
    <a href="mailto:api-support@smartpoolconnect.eu">api-support@smartpoolconnect.eu</a>.
  </p>

  <label for="apiKey">API key</label>
  <input id="apiKey" type="password" autocomplete="off" placeholder="spc_..." />

  <label for="baseUrl">API base URL (advanced)</label>
  <input id="baseUrl" type="text" value="https://api.smartpoolconnect.eu" />
  <div class="hint">Leave default unless SmartPoolConnect tells you otherwise.</div>

  <div id="error" class="error"></div>
  <button id="next" type="button">Continue</button>

  <script>
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('next');

    btn.addEventListener('click', async () => {
      errorEl.textContent = '';
      btn.disabled = true;
      try {
        const apiKey = document.getElementById('apiKey').value;
        const baseUrl = document.getElementById('baseUrl').value;
        const result = await Homey.emit('validate_credentials', { apiKey, baseUrl });
        if (!result || result.count === 0) {
          errorEl.textContent = 'No pools found on this account.';
          btn.disabled = false;
          return;
        }
        await Homey.showView('list_pools');
      } catch (err) {
        errorEl.textContent = err && err.message ? err.message : String(err);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
